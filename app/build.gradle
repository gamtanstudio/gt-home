plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtman.home'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtman.home"
        minSdk 29
        targetSdk 34
        versionCode 17
        versionName "3.9"
    }

    signingConfigs {
        gt {
            storeFile file('gt.keystore')
            storePassword 'gthome'
            keyAlias 'gt'
            keyPassword 'gthome'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gt
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
