plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gtman.hud'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtman.hud"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        gt {
            storeFile rootProject.file('app/gt.keystore')
            storePassword 'gthome'
            keyAlias 'gt'
            keyPassword 'gthome'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gt
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
